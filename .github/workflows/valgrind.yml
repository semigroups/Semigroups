name: Valgrind
on:
  workflow_dispatch:
  release:
    types: [created]
  push:
    branches:
      - rc-v*
  pull_request:
    paths:
      - src/*.[hc]pp
      - ".github/workflows/valgrind.yml"

concurrency:
  # Group by workflow and ref; the last component ensures that for pull
  # requests, we limit to 1 concurrent job, but for the main branch we don't
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.ref != 'refs/heads/main' || github.run_number }}
  # Only cancel intermediate pull request builds
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  test-valgrind:
    name: "Ubuntu / GAP 4.15 / valgrind"
    # Pinned to ubuntu-24.04 because ubuntu-latest (Ubuntu 26.04) ships
    # valgrind 3.26.0, which has a bug where readlink("/proc/self/exe") writes
    # past its return value (https://bugs.kde.org/show_bug.cgi?id=514094).
    # GAP uses this to locate its root directory, so under the buggy valgrind
    # GAP fails at startup with "cannot find 'lib/init.g'". Return to
    # ubuntu-latest once its valgrind includes the fix (in 3.26 branch, 3.27+).
    runs-on: ubuntu-24.04
    env:
      NO_COVERAGE: true
      VALGRIND: valgrind --trace-children=yes --leak-check=full --error-exitcode=1
    steps:
      - uses: actions/checkout@v7
      - name: "Output g++ version . . ."
        run: g++ --version
      - name: "Install Valgrind . . ."
        run: |
          sudo apt-get update
          sudo apt-get install valgrind
      - name: "Install GAP . . ."
        uses: gap-actions/setup-gap@v3
        with:
          gap-version: v4.15
          configflags: --enable-valgrind
      - name: "Build Semigroups . . ."
        uses: gap-actions/build-pkg@v3
        with:
          configflags: --disable-hpcombi
      - name: "Run SemigroupsTestInstall . . ."
        uses: gap-actions/run-pkg-tests@v4
        with:
          testfile: tst/github_actions/install.g
          pre-gap: ${{ env.VALGRIND }}
          coverage: false
      - name: "Run libsemigroups test . . ."
        uses: gap-actions/run-pkg-tests@v4
        with:
          testfile: tst/github_actions/libsemigroups.g
          pre-gap: ${{ env.VALGRIND }}
          coverage: false
      - name: "Run SemigroupsTestStandard (release candidate only) . . ."
        if: ${{ startsWith(github.ref_name, 'rc-v') }}
        uses: gap-actions/run-pkg-tests@v4
        with:
          testfile: tst/github_actions/standard-for-valgrind.g
          pre-gap: ${{ env.VALGRIND }}
          coverage: false
